name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  discover:
    name: Discover modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.list.outputs.modules }}
    steps:
      - uses: actions/checkout@v4

      - name: List modules
        id: list
        shell: bash
        run: |
          set -e
          # Every directory with a go.mod is a module CI must cover,
          # including _-prefixed ones (e.g. _template) — the Go toolchain
          # ignores their leading underscore, CI must not.
          list=""
          for f in */go.mod; do
            d="${f%/go.mod}"
            if [ -n "$list" ]; then
              list="$list,\"$d\""
            else
              list="\"$d\""
            fi
          done
          echo "modules=[$list]" >> "$GITHUB_OUTPUT"
          echo "Discovered modules: [$list]"

  test:
    needs: discover
    name: ${{ matrix.module }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        module: ${{ fromJSON(needs.discover.outputs.modules) }}
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          # _template has no external dependencies and therefore no go.sum;
          # setup-go fails when cache-dependency-path matches no file. The
          # dependency set is one TOML library, so the cache is worth nothing.
          cache: false

      - name: Verify formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...
